[package]
name = "awr-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
awr-core.workspace = true
awr-runtime.workspace = true
awr-context.workspace = true
awr-store.workspace = true
awr-source.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
rmcp = { version = "3.2.0", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }

[dev-dependencies]
rusqlite.workspace = true
sha2.workspace = true
rmcp = { version = "3.2.0", default-features = false, features = ["client", "transport-child-process"] }
tokio = { version = "1", features = ["time", "process"] }
