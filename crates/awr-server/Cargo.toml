[package]
name = "awr-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "AWR Team coordinator and authenticated scoped read service."

[dependencies]
awr-team-pg = { path = "../awr-team-pg" }
awr-team = { path = "../awr-team" }
clap = { workspace = true }
serde_json.workspace = true
serde.workspace = true
toml.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }

[features]
pg-tests = ["awr-team-pg/pg-tests"]

[dev-dependencies]
awr-core.workspace = true
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
