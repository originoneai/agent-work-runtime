[workspace]
members = ["crates/awr-core", "crates/awr-store", "crates/awr-source", "crates/awr-context", "crates/awr-runtime", "crates/awr-cli", "crates/awr-mcp"]
resolver = "3"
default-members = ["crates/awr-cli"]

[workspace.package]
version = "0.3.3"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"
repository = "https://github.com/originoneai/agent-work-runtime"

[workspace.dependencies]
awr-core = { path = "crates/awr-core" }
awr-store = { path = "crates/awr-store" }
awr-source = { path = "crates/awr-source" }
awr-context = { path = "crates/awr-context" }
awr-runtime = { path = "crates/awr-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ulid = { version = "1", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
toml = "1.1.5"
sha2 = "0.10.9"
url = "2.5.8"
serde_yaml_ng = "0.10.0"
yaml-rust2 = { version = "0.12.0", default-features = false }
pulldown-cmark = { version = "0.13.4", default-features = false }
globset = "0.4.20"
tiktoken-rs = "0.12.0"
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"
regex = "1.13.1"
base64 = "0.22.1"
