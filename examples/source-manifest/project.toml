[project]
name = "AWR example"
external_key = "awr-example"
authority_mode = "source_first"

[[sources]]
domain = "goal"
role = "primary"
path = "examples/basic/GOALS.md"
adapter = "markdown-heading-v1"
[sources.options]
key_prefix = "goal"

[[sources]]
domain = "plan"
role = "primary"
path = "examples/basic/PLAN.md"
adapter = "markdown-heading-v1"

[[sources]]
domain = "rules"
role = "primary"
path = "examples/basic/RULES.md"
adapter = "markdown-rules-v1"

[[sources]]
domain = "ledger"
role = "primary"
path = "examples/basic/work-ledger.yaml"
adapter = "yaml-ledger-v1"
