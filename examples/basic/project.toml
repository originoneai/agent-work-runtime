[project]
name = "AWR example"
external_key = "awr-example"
authority_mode = "source_first"

[[sources]]
domain = "goal"
role = "primary"
path = "GOALS.md"
adapter = "markdown-heading-v1"
[sources.options]
key_prefix = "goal"

[[sources]]
domain = "plan"
role = "primary"
path = "PLAN.md"
adapter = "markdown-heading-v1"
[sources.options]
key_prefix = "plan"

[[sources]]
domain = "rules"
role = "primary"
path = "RULES.md"
adapter = "markdown-rules-v1"

[[sources]]
domain = "ledger"
role = "primary"
path = "work-ledger.yaml"
adapter = "yaml-ledger-v1"
